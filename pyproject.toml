[project]
name = "igraph-agent"
version = "0.1.0"
description = "Consequence-aware change control for autonomous data agents using DataHub."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "httpx>=0.28,<1",
  "python-dotenv>=1.0,<2",
  "acryl-datahub>=1.1,<2",
  "datahub-agent-context>=1.7,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<1", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["igraph*"]

[tool.ruff]
line-length = 100
