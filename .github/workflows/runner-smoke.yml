name: iGraph runner smoke

on:
  push:
    branches:
      - agent/igraph-live-proof
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  runner-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm hosted runner
        run: |
          echo "GitHub-hosted runner reached"
          uname -a
          df -h
